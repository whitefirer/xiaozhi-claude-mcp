<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Code Monitor</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
<style>
  body { margin: 0; padding: 0; background: #1e1e1e; }
  #terminal { width: 100%; height: 100vh; }
</style>
</head>
<body>
<div id="terminal"></div>
<button id="logout" style="position:fixed;top:8px;right:8px;z-index:10;background:#333;color:#aaa;border:1px solid #555;border-radius:4px;padding:4px 12px;cursor:pointer;font-size:12px;">退出</button>
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
<script>
const term = new Terminal({
  cursorBlink: true,
  fontSize: 14,
  fontFamily: 'Menlo, Monaco, monospace',
  theme: { background: '#1e1e1e', foreground: '#d4d4d4' },
  cols: 120,
  rows: 40
});
const fit = new FitAddon.FitAddon();
term.loadAddon(fit);
term.open(document.getElementById('terminal'));
fit.fit();

const ws = new WebSocket(`ws://${location.host}/ws${location.search}`);
ws.binaryType = 'arraybuffer';
ws.onmessage = (e) => {
  if (e.data instanceof ArrayBuffer) {
    term.write(new Uint8Array(e.data));
  } else {
    term.write(e.data);
  }
};
ws.onclose = () => term.write('\r\n[Disconnected — refresh to reconnect]\r\n');
term.onData((data) => ws.send(data));
window.addEventListener('resize', () => fit.fit());
document.getElementById('logout').onclick = async () => {
  await fetch('/api/login/logout', { method: 'POST' });
  window.location.href = '/login';
};
</script>
</body>
</html>
